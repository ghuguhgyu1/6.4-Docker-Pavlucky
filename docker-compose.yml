version: "3.8"

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: pavluckyad-netology-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    depends_on:
      - pushgateway
    networks:
      - pavluckyad-my-netology-hw

  pushgateway:
    image: prom/pushgateway:latest
    container_name: pavluckyad-netology-pushgateway
    restart: unless-stopped
    ports:
      - "9091:9091"
    networks:
      - pavluckyad-my-netology-hw

  grafana:
    image: grafana/grafana:latest
    container_name: pavluckyad-netology-grafana
    restart: unless-stopped
    ports:
      - "80:3000"
    environment:
      GRAFANA_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}"
      GF_PATHS_CONFIG: /etc/grafana/custom.ini
    volumes:
      - ./grafana/custom.ini:/etc/grafana/custom.ini:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - pavluckyad-my-netology-hw

volumes:
  prometheus-data:
  grafana-data:

networks:
  pavluckyad-my-netology-hw:
    name: pavluckyad-my-netology-hw
    driver: bridge
    ipam:
      config:
        - subnet: 10.5.0.0/16
